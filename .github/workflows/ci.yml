name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Ruff code style check
        run: ruff check backend ai

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify Dockerfile & deps)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: 15min-life:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container boots
        run: |
          docker run --rm -d -p 8000:8000 -e BAIDU_AK_SERVER="" -e FORCE_MOCK=1 --name 15min-ci 15min-life:ci
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "health OK after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "---- container logs ----"
            docker logs 15min-ci || true
            echo "---- docker ps ----"
            docker ps -a
            echo "container failed to become healthy" && exit 1
          fi
