# 15分钟生活圈 · Qwen2.5-1.5B QLoRA 微调配置（LLaMA-Factory）
# 训练目标：把"社区体检结构化数据"转成"自然语言解读 + 选址建议"
model_name_or_path: models/Qwen2.5-1.5B-Instruct
template: qwen
stage: sft
finetuning_type: lora
dataset: 15min_sft
val_size: 0.1
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 1

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

quantization_bit: 4
quantization_method: bitsandbytes

learning_rate: 2.0e-4
num_train_epochs: 6.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
optim: paged_adamw_8bit
max_grad_norm: 1.0

logging_steps: 5
save_steps: 50
evaluation_strategy: steps
eval_steps: 50
do_eval: true

output_dir: models/qwen15min-lora
